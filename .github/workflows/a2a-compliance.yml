name: A2A Compliance Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * *' # Daily at midnight

jobs:
  compliance-level-1:
    name: Level 1 - Basic Messaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Level 1 compliance tests
        run: npm run test:a2a:level1

      - name: Generate compliance report
        run: npm run a2a:validate:level1
        continue-on-error: true

      - name: Upload Level 1 report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compliance-level-1
          path: reports/a2a/compliance_1_*.json

  compliance-level-2:
    name: Level 2 - Memory Sync
    runs-on: ubuntu-latest
    needs: compliance-level-1
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Level 2 compliance tests
        run: npm run test:a2a:level2
        env:
          REDIS_URL: redis://localhost:6379

      - name: Generate compliance report
        run: npm run a2a:validate:level2
        continue-on-error: true

      - name: Upload Level 2 report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compliance-level-2
          path: reports/a2a/compliance_2_*.json

  compliance-level-3:
    name: Level 3 - Service Discovery
    runs-on: ubuntu-latest
    needs: compliance-level-2
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Level 3 compliance tests
        run: npm run test:a2a:level3

      - name: Generate compliance report
        run: npm run a2a:validate:level3
        continue-on-error: true

      - name: Upload Level 3 report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compliance-level-3
          path: reports/a2a/compliance_3_*.json

  interoperability:
    name: Interop Tests - ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [codex, gemini-cli, opencode]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start Claude Flow server
        run: |
          npm run start &
          sleep 5
        env:
          PORT: 3000
          A2A_ENABLED: true

      - name: Setup ${{ matrix.platform }}
        run: |
          if [ -f "scripts/a2a/setup-platform-${{ matrix.platform }}.sh" ]; then
            bash scripts/a2a/setup-platform-${{ matrix.platform }}.sh
          else
            echo "Setup script not found for ${{ matrix.platform }}, skipping"
          fi

      - name: Run interop tests
        run: npm run test:a2a:interop
        continue-on-error: true

      - name: Upload interop report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interop-${{ matrix.platform }}
          path: reports/a2a/interop_${{ matrix.platform }}_*.json

  compliance-report:
    name: Generate Combined Report
    runs-on: ubuntu-latest
    needs: [compliance-level-1, compliance-level-2, compliance-level-3, interoperability]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: reports/a2a

      - name: Generate combined report
        run: |
          node scripts/a2a/merge-reports.js \
            --input reports/a2a \
            --output reports/compliance-full.json \
            --html reports/compliance-full.html
        continue-on-error: true

      - name: Upload combined report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compliance-full
          path: |
            reports/compliance-full.json
            reports/compliance-full.html

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let comment = '## A2A Compliance Report\n\n';

            try {
              const report = JSON.parse(fs.readFileSync('reports/compliance-full.json', 'utf8'));

              comment += '### Compliance Levels\n\n';
              comment += '| Level | Status | Tests Passed | Score |\n';
              comment += '|-------|--------|-------------|-------|\n';

              for (let i = 1; i <= 4; i++) {
                const level = report[`level${i}`];
                if (level) {
                  const status = level.percentage >= 80 ? '✅' : '⚠️';
                  comment += `| Level ${i} | ${status} | ${level.passed}/${level.passed + level.failed} | ${level.percentage.toFixed(1)}% |\n`;
                }
              }

              comment += '\n### Interoperability\n\n';
              comment += '| Platform | Status | Tests Passed |\n';
              comment += '|----------|--------|-------------|\n';

              if (report.interop) {
                report.interop.forEach(p => {
                  const status = p.passed === p.total ? '✅' : '⚠️';
                  comment += `| ${p.platform} | ${status} | ${p.passed}/${p.total} |\n`;
                });
              }

              comment += '\n[View full report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n';

            } catch (error) {
              comment += '⚠️ Could not generate detailed report. Check workflow logs for details.\n';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=moderate

      - name: Run A2A security tests
        run: npm run test:a2a:security
        continue-on-error: true
